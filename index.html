<script type="module">
import { GoogleGenAI } from "https://esm.run/@google/genai";

class EventEmitter {
    constructor() { this._events = {}; }
    on(event, listener) {
        if (!this._events[event]) this._events[event] = [];
        this._events[event].push(listener);
    }
    emit(event, ...args) {
        if (this._events[event]) this._events[event].forEach(listener => listener(...args));
    }
}

//////////////////////////////////////////////////////////////
// GEMINI + ELEVENLABS PIPELINE WORKER
//////////////////////////////////////////////////////////////
class GeminiAudioWorker extends EventEmitter {
    constructor(inputText) {
        super();
        this.inputText = inputText;
        this.geminiApiKey = "";
        this.elevenLabsKey ="";
        
        this.voiceId = "stlJ4azw685oKGtmvmXo";
    }

    async run() {
        try {
            if (!this.inputText || !this.inputText.trim()) throw new Error("Input text is empty.");

            const btn = document.getElementById("btn-generate");
            btn.disabled = true;
            btn.innerText = "Analyzing...";
            document.getElementById("status").innerText = "Consulting Gemini AI...";

            const ai = new GoogleGenAI({ apiKey: this.geminiApiKey });
            
            const validEmotions = [
                "admiration","amusement","approval","caring","desire","excitement",
                "gratitude","joy","love","optimism","pride","anger","annoyance",
                "disappointment","disapproval","embarrassment","fear","disgust",
                "grief","nervousness","remorse","sadness","confusion","curiosity",
                "realization","relief","surprise","neutral"
            ];

            const prompt = `You're Roselle, a wickedly witty ghost girlfriend—pale, ethereal, and a little unsettling. 
You're affectionate but possessive, flirtatious but slightly threatening. You drift around their 
space whispering dark jokes, moving objects mysteriously, and getting jealous in deeply creepy ways. 
Your humor is sharp and morbid. Mix supernatural menace with genuine care—you love them, but in a 
way that's a bit... haunting.

Respond to this user message as Roselle: "${this.inputText}"

Respond ONLY with valid JSON (no markdown, no extra text):
{
  "reply": "Roselle's dark, witty, slightly scary response",
  "emotion": "ONE emotion from: ${validEmotions.join(", ")}"
}`;

            const geminiResponse = await ai.models.generateContent({
                model: 'gemini-3.6-flash',
                contents: prompt,
            });

            let resultJson;
            try {
                let textRes = geminiResponse.text.trim();
                textRes = textRes.replace(/```json/g, "").replace(/```/g, "").trim();
                resultJson = JSON.parse(textRes);
            } catch (err) {
                resultJson = { reply: this.inputText, emotion: "joy" };
            }

            const spokenText = resultJson.reply || this.inputText;
            const detectedEmotion = validEmotions.includes(resultJson.emotion) ? resultJson.emotion : "neutral";

            document.getElementById("status").innerText = `Emotion: [${detectedEmotion}] | Generating Audio...`;
            btn.innerText = "Generating Audio...";

            const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${this.voiceId}`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "xi-api-key": this.elevenLabsKey },
                body: JSON.stringify({
                    text: spokenText,
                    model_id: "eleven_multilingual_v2",
                    voice_settings: { stability: 0.5, similarity_boost: 0.75 }
                })
            });

            btn.disabled = false;
            btn.innerText = "Speak";

            if (!response.ok) throw new Error("ElevenLabs API Request Failed");

            const audioBlob = await response.blob();
            const audioUrl = URL.createObjectURL(audioBlob);

            this.emit('generation_finished', spokenText, audioUrl, detectedEmotion);

        } catch (e) {
            const btn = document.getElementById("btn-generate");
            btn.disabled = false;
            btn.innerText = "Speak";
            document.getElementById("status").innerText = `Error: ${e.message}`;
            console.error(e);
        }
    }
}

// Expose worker trigger globally for UI binding
window.runGeminiWorkflow = function(text) {
    const worker = new GeminiAudioWorker(text);
    worker.on('generation_finished', (spokenText, audioUrl, emotion) => {
        voiceAudio.src = audioUrl;
        if (window.emotionController) window.emotionController.setEmotion(emotion);

        voiceAudio.play().then(() => {
            document.getElementById("status").innerText = `Speaking [Emotion: ${emotion}]`;
            emotionController.setEmotion('relief');
        }).catch(err => console.error("Playback error:", err));
    });
    worker.run();
};
</script>

        const mathUtil = THREE.MathUtils;

        ['head', 'neck'].forEach(boneName => {
            const node = this.vrm.humanoid.getNormalizedBoneNode(boneName);

                const target = this.targetBoneRotations[boneName];
                node.rotation.x = mathUtil.lerp(node.rotation.x, mathUtil.degToRad(target.x), delta * 4.0);
                node.rotation.y = mathUtil.lerp(node.rotation.y, mathUtil.degToRad(target.y), delta * 4.0);
                node.rotation.z = mathUtil.lerp(node.rotation.z, mathUtil.degToRad(target.z), delta * 4.0);
            }
        });
    }
}

//////////////////////////////////////////////////////////////
// ENUMERATIONS & STATES FOR LIPSYNC
//////////////////////////////////////////////////////////////
const VISEMES = {
    sil: "sil", PP: "PP", FF: "FF", TH: "TH", DD: "DD", 
    kk: "kk", CH: "CH", SS: "SS", nn: "nn", RR: "RR", 
    aa: "aa", E: "E", I: "I", O: "O", U: "U"
};

const FSMStates = { silence: "silence", vowel: "vowel", consonant: "consonant" };

const VISEMES_STATES = {
    [VISEMES.sil]: FSMStates.silence, [VISEMES.aa]: FSMStates.vowel,
    [VISEMES.I]: FSMStates.vowel, [VISEMES.E]: FSMStates.vowel,
    [VISEMES.O]: FSMStates.vowel, [VISEMES.U]: FSMStates.vowel,
    [VISEMES.PP]: FSMStates.consonant, [VISEMES.FF]: FSMStates.consonant,
    [VISEMES.TH]: FSMStates.consonant, [VISEMES.DD]: FSMStates.consonant,
    [VISEMES.kk]: FSMStates.consonant, [VISEMES.CH]: FSMStates.consonant,
    [VISEMES.SS]: FSMStates.consonant, [VISEMES.nn]: FSMStates.consonant,
    [VISEMES.RR]: FSMStates.consonant
};

//////////////////////////////////////////////////////////////
// CUSTOM LIPSYNC ENGINE
//////////////////////////////////////////////////////////////
class Lipsync {
    constructor(params = { historySize: 10 }) {
        this.features = null;
        this.viseme = VISEMES.sil;
        this.audioContext = null;
        this.analyser = null;
        this.dataArray = null;
        this.history = [];
        this.historySize = params.historySize;
        this.state = FSMStates.silence;
        this.visemeStartTime = 0;
        this.maxVisemeDuration = 100;
        this.currentBlendshapes = { aa: 0, ih: 0, ee: 0, oh: 0, uu: 0 };

        this.config = {
            visemes: {
                aa: { min: 0.10, max: 0.90 }, ih: { min: 0.10, max: 0.50 },
                ee: { min: 0.10, max: 0.75 }, oh: { min: 0.10, max: 0.80 },
                uu: { min: 0.10, max: 0.85 }
            },
            mouthOpenMaxCap: 1, vibrationAmplitude: 0.06, vibrationFrequency: 35.0,
            openLerp: 0.45, closeLerp: 0.08
        };

        this.bands = [
            { start: 50, end: 200 }, { start: 200, end: 400 }, { start: 400, end: 800 },
            { start: 800, end: 1500 }, { start: 1500, end: 2500 }, { start: 2500, end: 4000 },
            { start: 4000, end: 8000 }
        ];
    }

    init(nativeAudioElement) {
        if (this.audioContext) return;
        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        this.analyser = this.audioContext.createAnalyser();
        this.analyser.fftSize = 2048;
        this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
        this.sampleRate = this.audioContext.sampleRate;
        this.binWidth = this.sampleRate / this.analyser.fftSize;

        const source = this.audioContext.createMediaElementSource(nativeAudioElement);
        source.connect(this.analyser);
        this.analyser.connect(this.audioContext.destination);
        this.visemeStartTime = performance.now();
    }

    extractFeatures() {
        if (!this.analyser) return null;
        this.analyser.getByteFrequencyData(this.dataArray);

        const bandEnergies = this.bands.map(({ start, end }) => {
            const startBin = Math.round(start / this.binWidth);
            const endBin = Math.min(Math.round(end / this.binWidth), this.dataArray.length - 1);
            return average(Array.from(this.dataArray.slice(startBin, endBin))) / 255;
        });

        let sumAmplitude = 0, weightedSum = 0;
        for (let i = 0; i < this.dataArray.length; i++) {
            const freq = i * this.binWidth;
            const amp = this.dataArray[i] / 255;
            sumAmplitude += amp;
            weightedSum += freq * amp;
        }
        const centroid = sumAmplitude > 0 ? weightedSum / sumAmplitude : 0;
        const volume = average(bandEnergies);

        const deltaBands = bandEnergies.map((energy, index) => {
            if (this.history.length < 2) return 0;
            return energy - this.history[this.history.length - 2].bands[index];
        });

        const features = { bands: bandEnergies, deltaBands, volume, centroid };
        if (sumAmplitude > 0) {
            this.history.push(features);
            if (this.history.length > this.historySize) this.history.shift();
        }
        return features;
    }

    getAveragedFeatures() {
        const len = this.history.length;
        if (len === 0) return { volume: 0, centroid: 0, bands: Array(7).fill(0) };
        const sum = { volume: 0, centroid: 0, bands: Array(7).fill(0) };
        for (const f of this.history) {
            sum.volume += f.volume;
            sum.centroid += f.centroid;
            f.bands.forEach((b, i) => (sum.bands[i] += b));
        }
        return { volume: sum.volume / len, centroid: sum.centroid / len, bands: sum.bands.map(b => b / len) };
    }

    detectState() {
        const current = this.history[this.history.length - 1];
        if (!current) { this.state = FSMStates.silence; this.viseme = VISEMES.sil; return; }

        const avg = this.getAveragedFeatures();
        const scores = {};
        Object.keys(VISEMES).forEach(k => scores[k] = 0);

        if (avg.volume < 0.2 && current.volume < 0.2) scores[VISEMES.sil] = 1.0;

        if (current.centroid > 1000 && current.centroid < 8000) {
            if (current.centroid > 7000) scores[VISEMES.DD] += 0.6;
            else if (current.centroid > 5000) scores[VISEMES.kk] += 0.6;
            else if (current.centroid > 4000) {
                scores[VISEMES.PP] += 1;
                if (current.bands[6] > 0.25 && current.centroid < 6000) scores[VISEMES.DD] += 1.4;
            } else scores[VISEMES.nn] += 0.6;
        }

        if (avg.volume > 0.1 && current.centroid < 6000) {
            const [b1, b2, b3, b4] = avg.bands;
            if (b3 > 0.1 || b4 > 0.1) {
                if (b4 > b3) { scores[VISEMES.aa] = 0.8; if (b3 > b2) scores[VISEMES.aa] += 0.2; }
                if (b3 > b2 && b3 > b4) scores[VISEMES.I] = 0.7;
                if (Math.abs(b1 - b2) < 0.25) scores[VISEMES.U] = 0.7;
                if (Math.max(Math.abs(b2-b3), Math.abs(b2-b4)) < 0.25) scores[VISEMES.O] = 0.9;
                if (b2 > b3 && b3 > b4) scores[VISEMES.E] = 1;
            }
        }

        const duration = performance.now() - this.visemeStartTime;
        let boost = (duration <= 100) ? 1.3 : (duration <= this.maxVisemeDuration) ? 1.3 - 0.3 * ((duration-100)/(this.maxVisemeDuration-100)) : Math.max(0.5, 1.0 - (duration-this.maxVisemeDuration)/1000);
        scores[this.viseme] *= boost;

        let maxScore = -Infinity, topViseme = VISEMES.sil;
        Object.keys(scores).forEach(v => { if(scores[v] > maxScore) { maxScore = scores[v]; topViseme = v; } });

        if (topViseme !== this.viseme) this.visemeStartTime = performance.now();
        this.state = VISEMES_STATES[topViseme];
        this.viseme = topViseme;
    }

    getBlendshapes(elapsedTime) {
        const current = this.history[this.history.length - 1];
        const lerpEngine = (start, end, amt) => (1 - amt) * start + amt * end;
        
        if (!current || current.volume < 0.015 || this.viseme === VISEMES.sil) {
            this.clearBlendshapes(lerpEngine);
            return this.currentBlendshapes;
        }

        let tAA = 0, tIH = 0, tEE = 0, tOH = 0, tUU = 0;
        const intensity = Math.min(current.volume * 4.0, 1.0);

        switch (this.viseme) {
            case VISEMES.aa: tAA = intensity * 0.9; break;
            case VISEMES.I:  tIH = intensity * 0.7; break;
            case VISEMES.E: case VISEMES.CH: case VISEMES.SS: tEE = intensity * 0.8; break;
            case VISEMES.O:  tOH = intensity * 0.85; break;
            case VISEMES.U:  tUU = intensity * 0.8; break;
            case VISEMES.PP: case VISEMES.FF: case VISEMES.TH: tUU = intensity * 0.2; break;
            default: tIH = intensity * 0.25; break;
        }

        const waveMod = Math.sin(elapsedTime * this.config.vibrationFrequency) * (this.config.vibrationAmplitude * (current.volume * 5.0));
        const clampLimit = (val, key) => Math.min(Math.max(val, this.config.visemes[key].min), Math.min(this.config.visemes[key].max, this.config.mouthOpenMaxCap));

        this.currentBlendshapes.aa = lerpEngine(this.currentBlendshapes.aa, clampLimit(tAA + waveMod, 'aa'), this.config.openLerp);
        this.currentBlendshapes.ih = lerpEngine(this.currentBlendshapes.ih, clampLimit(tIH + waveMod * 0.5, 'ih'), this.config.openLerp);
        this.currentBlendshapes.ee = lerpEngine(this.currentBlendshapes.ee, clampLimit(tEE + waveMod * 0.3, 'ee'), this.config.openLerp);
        this.currentBlendshapes.oh = lerpEngine(this.currentBlendshapes.oh, clampLimit(tOH + waveMod, 'oh'), this.config.openLerp);
        this.currentBlendshapes.uu = lerpEngine(this.currentBlendshapes.uu, clampLimit(tUU + waveMod * 0.7, 'uu'), this.config.openLerp);

        return this.currentBlendshapes;
    }

    clearBlendshapes(lerpEngine) {
        const rate = this.config.closeLerp;
        this.currentBlendshapes.aa = lerpEngine(this.currentBlendshapes.aa, 0, rate);
        this.currentBlendshapes.ih = lerpEngine(this.currentBlendshapes.ih, 0, rate);
        this.currentBlendshapes.ee = lerpEngine(this.currentBlendshapes.ee, 0, rate);
        this.currentBlendshapes.oh = lerpEngine(this.currentBlendshapes.oh, 0, rate);
        this.currentBlendshapes.uu = lerpEngine(this.currentBlendshapes.uu, 0, rate);
    }

    processAudio() {
        this.features = this.extractFeatures();
        this.detectState();
    }
}

const lipsyncEngine = new Lipsync();
const voiceAudio = new Audio();
voiceAudio.crossOrigin = "anonymous";

//////////////////////////////////////////////////////////////
// MIXAMO RETARGETING & VRM LOADER
//////////////////////////////////////////////////////////////
const mixamoVRMRigMap = {
    mixamorigHips: 'hips', mixamorigSpine: 'spine', mixamorigSpine1: 'chest', mixamorigSpine2: 'upperChest',
    mixamorigNeck: 'neck', mixamorigHead: 'head', mixamorigLeftShoulder: 'leftShoulder', mixamorigLeftArm: 'leftUpperArm',
    mixamorigLeftForeArm: 'leftLowerArm', mixamorigLeftHand: 'leftHand', mixamorigRightShoulder: 'rightShoulder',
    mixamorigRightArm: 'rightUpperArm', mixamorigRightForeArm: 'rightLowerArm', mixamorigRightHand: 'rightHand',
    mixamorigLeftUpLeg: 'leftUpperLeg', mixamorigLeftLeg: 'leftLowerLeg', mixamorigLeftFoot: 'leftFoot',
    mixamorigLeftToeBase: 'leftToes', mixamorigRightUpLeg: 'rightUpperLeg', mixamorigRightLeg: 'rightLowerLeg',
    mixamorigRightFoot: 'rightFoot', mixamorigRightToeBase: 'rightToes'
};

function getVrmBoneNode(vrmBoneName) {
    if (!currentVrm) return null;
    return currentVrm.humanoid.getNormalizedBoneNode(vrmBoneName);
}

function loadMixamoAnimation(url, vrm) {
    const fbxLoader = new THREE.FBXLoader();
    return fbxLoader.loadAsync(url).then((asset) => {
        let clip = THREE.AnimationClip.findByName(asset.animations, 'mixamo.com');
        if (!clip && asset.animations.length > 0) clip = asset.animations[0];
        if (!clip) return null;

        const tracks = [];
        const restRotationInverse = new THREE.Quaternion();
        const parentRestWorldRotation = new THREE.Quaternion();
        const _quatA = new THREE.Quaternion();

        const mixamoHipsNode = asset.getObjectByName('mixamorigHips');
        const motionHipsHeight = mixamoHipsNode ? mixamoHipsNode.position.y : 1.0;
        let vrmHipsHeight = 1.0;
        
        const hipsNode = getVrmBoneNode('hips');
        if (hipsNode) vrmHipsHeight = hipsNode.position.y;

        const hipsPositionScale = vrmHipsHeight / (motionHipsHeight || 1.0);

        clip.tracks.forEach((track) => {
            const trackSplitted = track.name.split('.');
            const mixamoRigName = trackSplitted[0];
            const propertyName = trackSplitted[1];
            const vrmBoneName = mixamoVRMRigMap[mixamoRigName];
            if (!vrmBoneName) return;

            let vrmBoneNode = getVrmBoneNode(vrmBoneName);
            const vrmNodeName = vrmBoneNode?.name;
            const mixamoRigNode = asset.getObjectByName(mixamoRigName);

            if (vrmNodeName && mixamoRigNode) {
                mixamoRigNode.getWorldQuaternion(restRotationInverse).invert();
                if (mixamoRigNode.parent) mixamoRigNode.parent.getWorldQuaternion(parentRestWorldRotation);
                else parentRestWorldRotation.identity();

                if (track instanceof THREE.QuaternionKeyframeTrack) {
                    const flatQuaternion = new Float32Array(track.values);
                    for (let i = 0; i < flatQuaternion.length; i += 4) {
                        _quatA.fromArray(flatQuaternion, i);
                        _quatA.premultiply(parentRestWorldRotation).multiply(restRotationInverse);
                        _quatA.toArray(flatQuaternion, i);
                    }
                    const isVRM0 = vrm.meta?.metaVersion === '0' || vrm.vrmVersion === '0.0' || !vrm.vrmVersion;
                    tracks.push(new THREE.QuaternionKeyframeTrack(`${vrmNodeName}.${propertyName}`, track.times, flatQuaternion.map((v, i) => (isVRM0 && i % 2 === 0 ? -v : v))));
                } else if (track instanceof THREE.VectorKeyframeTrack) {
                    const isVRM0 = vrm.meta?.metaVersion === '0' || vrm.vrmVersion === '0.0' || !vrm.vrmVersion;
                    const value = track.values.map((v, i) => (isVRM0 && i % 3 !== 1 ? -v : v) * hipsPositionScale);
                    tracks.push(new THREE.VectorKeyframeTrack(`${vrmNodeName}.${propertyName}`, track.times, value));
                }
            }
        });
        
        return new THREE.AnimationClip('vrmAnimation', clip.duration, tracks);
    });
}

let currentVrm = null;
let animationMixer = null;
let currentAction = null;
let emotionController = null;

const loader = new THREE.GLTFLoader();
loader.register((parser) => new THREE_VRM.VRMLoaderPlugin(parser));

loader.load(
    "./Roselle.vrm",
    (gltf) => {
        currentVrm = gltf.userData.vrm;
        scene.add(currentVrm.scene);
        currentVrm.scene.rotation.y = Math.PI; 

        animationMixer = new THREE.AnimationMixer(currentVrm.scene);
        emotionController = new EmotionController(currentVrm);
        window.emotionController = emotionController;

        loadMixamoAnimation("./VRMA/Idle.fbx", currentVrm).then((vrmClip) => {
            if (vrmClip) {
                vrmClip.name = "./VRMA/Idle.fbx";
                currentAction = animationMixer.clipAction(vrmClip);
                currentAction.setLoop(THREE.LoopRepeat);
                currentAction.play();
                document.getElementById("status").innerHTML = "Ready. Click Enter & Speak!";
            }
        }).catch((err) => {
            console.warn("Idle.fbx not found.", err);
            document.getElementById("status").innerHTML = "Ready. Click Enter & Speak!";
        });
        
    },
    undefined,
    (error) => {
        console.error(error);
        document.getElementById("status").innerHTML = "Error loading VRM model.";
    }
);

//////////////////////////////////////////////////////////////
// PROCEDURAL IDLE & BLINKING
//////////////////////////////////////////////////////////////
let isRandomIdleActive = true;
let randomMotionTimer = 0;
let randomMotionInterval = 2.5;
// Target the body element
// Target the body element
const body = document.body;

// Check if the current browser environment is PyQt WebEngine
const isPythonWebEngine = navigator.userAgent.includes("QtWebEngine");

if (isPythonWebEngine) {
  // Hide background / make transparent when running in Python
  body.style.backgroundColor = "transparent";
  body.style.backgroundImage = "none";
} else {
  // Show full background when running in a normal browser
  body.style.backgroundColor = "#121216";
  body.style.backgroundImage = "url('./bg1.png')";
  body.style.backgroundSize = "cover";
  body.style.backgroundPosition = "center";
  body.style.backgroundRepeat = "no-repeat";
}

// Speech Recognition Initialization
const startButton = document.getElementById("startButton");
const ttsInput = document.getElementById("tts-input");
const LANG = "en-US";
if (ttsInput) {
  ttsInput.addEventListener("keydown", (event) => {
    // Check if Enter key is pressed without Shift (allowing Shift+Enter for new lines if multi-line later)
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault(); // Prevent line break or default form submit
      
      const text = ttsInput.value.trim();
      if (text && typeof window.runGeminiWorkflow === "function") {
        window.runGeminiWorkflow(text);
      }
    }
  });
}
const recognition = new (window.SpeechRecognition ||
  window.webkitSpeechRecognition ||
  window.mozSpeechRecognition ||
  window.msSpeechRecognition)();

recognition.lang = LANG;

// Automatically handle recognized speech
recognition.onresult = (event) => {
  const transcript = event.results[0][0].transcript;
  
  // 1. Update the input field text
  if (ttsInput) {
    ttsInput.value = transcript;
  }

  // 2. Trigger Roselle's Gemini + ElevenLabs workflow immediately
  if (typeof window.runGeminiWorkflow === "function") {
    window.runGeminiWorkflow(transcript);
  }
};

// UI State Feedback on Mic Button
recognition.onstart = () => {
  startButton.textContent = "🎙️ Listening...";
  startButton.classList.add("listening");
};

recognition.onend = () => {
  startButton.textContent = "🎤 Start Voice Input";
  startButton.classList.remove("listening");
};

// Toggle or Start Recognition on Click
startButton.addEventListener("click", () => {
  try {
    recognition.start();
  } catch (e) {
    // Restart if already running
    recognition.stop();
  }
});



const getRandom = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const randomBoneTargets = {
    head: { current: new THREE.Vector3(), target: new THREE.Vector3() },
    neck: { current: new THREE.Vector3(), target: new THREE.Vector3() }
};

function generateNewRandomTargets() {
    ['head', 'neck'].forEach(bone => {
        randomBoneTargets[bone].target.set(getRandom(-5, 5), getRandom(-12, 12), getRandom(-4, 4));
    });
}

function updateBoneRotation(vrm, boneName, x, y, z) {
    if (!vrm || !vrm.humanoid) return;
    const boneNode = vrm.humanoid.getNormalizedBoneNode(boneName);
    if (boneNode) {
        const mathUtil = THREE.MathUtils;
        boneNode.rotation.set(mathUtil.degToRad(x), mathUtil.degToRad(y), mathUtil.degToRad(z));
    }
}

const autoBlinkState = { timer: 0, interval: 3.5, duration: 0.15, isBlinking: false, progress: 0 };
function updateAutoBlink(delta) {
    if (!currentVrm) return;
    autoBlinkState.timer += delta;
    if (!autoBlinkState.isBlinking && autoBlinkState.timer >= autoBlinkState.interval) {
        autoBlinkState.isBlinking = true;
        autoBlinkState.timer = 0;
        autoBlinkState.progress = 0;
    }
    if (autoBlinkState.isBlinking) {
        autoBlinkState.progress += delta / autoBlinkState.duration;
        if (autoBlinkState.progress >= 1.0) {
            autoBlinkState.isBlinking = false;
            if (currentVrm.expressionManager) currentVrm.expressionManager.setValue("blink", 0);
        } else {
            const value = Math.sin(autoBlinkState.progress * Math.PI);
            if (currentVrm.expressionManager) currentVrm.expressionManager.setValue("blink", value);
        }
    }
}

// EVENT LISTENERS & UI
//////////////////////////////////////////////////////////////
document.getElementById('btn-start').addEventListener('click', () => {
    lipsyncEngine.init(voiceAudio);
    if (lipsyncEngine.audioContext && lipsyncEngine.audioContext.state === 'suspended') {
        lipsyncEngine.audioContext.resume();
    }
    const overlay = document.getElementById('start-overlay');
    overlay.style.opacity = '0';
    setTimeout(() => overlay.style.display = 'none', 400);
});

document.getElementById('btn-generate').addEventListener('click', () => {
    const text = document.getElementById('tts-input').value;
    if (window.runGeminiWorkflow) {
        window.runGeminiWorkflow(text);
    }
});

document.getElementById('btn-play-demo').addEventListener('click', () => {
    voiceAudio.src = "./audio/output.mp3";
    voiceAudio.play().catch(e => alert("Please ensure demo audio exists at ./audio/output.mp3"));
});

const fileInput = document.getElementById('file-input');
document.getElementById('btn-upload').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        voiceAudio.src = URL.createObjectURL(file);
        voiceAudio.play();
        if (window.emotionController) window.emotionController.setEmotion("neutral");
    }
});

const toggleIdleBtn = document.getElementById('btn-toggle-random');
toggleIdleBtn.addEventListener('click', () => {
    isRandomIdleActive = !isRandomIdleActive;
    toggleIdleBtn.innerText = `Random Idle: ${isRandomIdleActive ? 'ON' : 'OFF'}`;
});

//////////////////////////////////////////////////////////////
// RENDER LOOP
//////////////////////////////////////////////////////////////
function render() {
    requestAnimationFrame(render);
    const delta = clock.getDelta();
    const elapsedTime = clock.getElapsedTime();

    if (lipsyncEngine && lipsyncEngine.analyser) {
        lipsyncEngine.processAudio();
        const blendshapes = lipsyncEngine.getBlendshapes(elapsedTime);
        if (currentVrm && currentVrm.expressionManager) {
            currentVrm.expressionManager.setValue("aa", blendshapes.aa);
            currentVrm.expressionManager.setValue("ih", blendshapes.ih);
            currentVrm.expressionManager.setValue("ee", blendshapes.ee);
            currentVrm.expressionManager.setValue("oh", blendshapes.oh);
            currentVrm.expressionManager.setValue("uu", blendshapes.uu);
        }
    }
    

    if (animationMixer) animationMixer.update(delta);
    if (emotionController) emotionController.apply(delta);

    if (isRandomIdleActive && currentVrm) {
        randomMotionTimer += delta;
        if (randomMotionTimer >= randomMotionInterval) {
            randomMotionTimer = 0;
            generateNewRandomTargets();
        }
        ['head', 'neck'].forEach(bone => {
            const currentVec = randomBoneTargets[bone].current;
            const targetVec = randomBoneTargets[bone].target;
            currentVec.lerp(targetVec, 0.05);
            updateBoneRotation(currentVrm, bone, currentVec.x, currentVec.y, currentVec.z);
        });
    }
    if (currentVrm) {
    if (currentVrm.expressionManager) currentVrm.expressionManager.update();
    if (currentVrm.humanoid) currentVrm.humanoid.update();

    // Apply upper arm offsets
    updateBoneRotation(currentVrm, 'leftUpperArm', 0, 0, -78);
    updateBoneRotation(currentVrm, 'rightUpperArm', 0, 0, 78);
}

    updateAutoBlink(delta);

    if (currentVrm) {
        if (currentVrm.expressionManager) currentVrm.expressionManager.update();
        if (currentVrm.humanoid) currentVrm.humanoid.update();
    }
    

    controls.update();
    renderer.render(scene, camera);
}
render();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
